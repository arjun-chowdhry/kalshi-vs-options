# Continuous integration: on every push and pull request, lint and run the full test suite.
#
# - Python comes from .python-version (the same file the project's venv follows), so CI and
#   the laptop run the same version.
# - optdesk installs from the public options-desk repo at the commit pinned in pyproject.toml.
#   No token is used, so if that repo ever goes private this fails at the install step.
# - The network is used only to install packages. The tests themselves are offline:
#   tests/conftest.py refuses every outbound connection and DNS lookup, so a test that
#   tried to reach Kalshi or yfinance would fail here, loudly.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: read

concurrency: # a newer push to the same branch cancels the older, still-running check
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Tests (pytest, offline)
        run: pytest
